[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "time-policy"
version = "0.1.0"
description = "Deterministic compiler for non-contiguous time policies."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "hypothesis>=6.120,<7",
]
experiment = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "PyYAML>=6,<7",
  "psutil>=7,<8",
]
dev = [
  "time-policy[test,experiment]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "exhaustive: exhaustive small-domain correctness tests",
  "property: Hypothesis property-based tests",
  "slow: tests that are intentionally expensive",
]

[tool.coverage.run]
branch = true
source = ["time_policy"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
